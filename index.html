<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADAFA - Acceso ERP</title>
    <link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_o9yz3yo9yz3yo9yz.jpg">
    <link rel="apple-touch-icon" href="Gemini_Generated_Image_o9yz3yo9yz3yo9yz.jpg">
    <meta name="apple-mobile-web-app-title" content="SADAFA ERP">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .login-card { background: rgba(30, 41, 59, 0.95); padding: 3rem 2.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); width: 100%; max-width: 420px; border: 1px solid #334155; position: relative; z-index: 10; }
        .brand-title { font-weight: 800; color: #2dd4bf; text-align: center; margin-bottom: 0.5rem; font-size: 2rem; letter-spacing: 1px; }
        .brand-subtitle { color: #94a3b8; text-align: center; margin-bottom: 2.5rem; font-size: 0.95rem; }
        .form-control { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px; border-radius: 8px; }
        .form-control:focus { background-color: #0f172a; border-color: #2dd4bf; box-shadow: 0 0 0 0.25rem rgba(45, 212, 191, 0.25); color: #f8fafc; }
        .btn-login { background-color: #0b3c36; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1rem; transition: background-color 0.3s; }
        .btn-login:hover { background-color: #2dd4bf; color: #0b3c36; }
        .text-muted { color: #64748b !important; }
        
        .bg-circle-1 { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(45,212,191,0.1) 0%, rgba(15,23,42,0) 70%); top: -100px; left: -100px; z-index: 1; border-radius: 50%; }
        .bg-circle-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(11,60,54,0.15) 0%, rgba(15,23,42,0) 70%); bottom: -150px; right: -150px; z-index: 1; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>

    <div class="login-card">
        <h1 class="brand-title">SADAFA <i class="bi bi-shield-lock ms-2"></i></h1>
        <p class="brand-subtitle">Servicios Integrales S.A.S.</p>

        <div id="errorAlert" class="alert alert-danger d-none small py-2" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3 position-relative">
                <label class="form-label text-muted small fw-bold ms-1">Correo Corporativo</label>
                <input type="email" id="email" class="form-control" placeholder="usuario@sadafa.com.co" required>
            </div>
            
            <div class="mb-4 position-relative">
                <label class="form-label text-muted small fw-bold ms-1">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" id="btnSubmit" class="btn btn-login w-100">Ingresar al Sistema</button>
        </form>
    </div>

    <!-- LÓGICA DE FIREBASE Y VERIFICACIÓN DE INACTIVIDAD -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC81HOxo4CAcIe1jFeZB63sc7MTGAfngOY",
            authDomain: "sadafa-erp.firebaseapp.com",
            projectId: "sadafa-erp",
            storageBucket: "sadafa-erp.firebasestorage.app",
            messagingSenderId: "874852761234",
            appId: "1:874852761234:web:2604386d38e9d84233b04b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TIEMPO_LIMITE_INACTIVIDAD = 10 * 60 * 1000; // 10 Minutos

        // 1. VERIFICACIÓN INTELIGENTE DE SESIÓN AL ENTRAR (Evita pedir correo si estás activo)
        const tokenActivo = localStorage.getItem('sadafa_token');
        const ultimaActividad = localStorage.getItem('sadafa_last_activity');

        if (tokenActivo && ultimaActividad) {
            const tiempoInactivo = Date.now() - parseInt(ultimaActividad);
            if (tiempoInactivo < TIEMPO_LIMITE_INACTIVIDAD) {
                // La sesión es válida y reciente, entra directo sin pedir login
                window.location.replace('admin.html');
            } else {
                // Pasaron más de 10 minutos (celular bloqueado, app cerrada). Destruimos sesión
                localStorage.removeItem('sadafa_token');
                localStorage.removeItem('sadafa_rol');
                localStorage.removeItem('sadafa_nombre');
                localStorage.removeItem('sadafa_last_activity');
                signOut(auth);
            }
        }

        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const btnSubmit = document.getElementById('btnSubmit');

        function mostrarError(mensaje) {
            errorAlert.innerText = mensaje;
            errorAlert.classList.remove('d-none');
            btnSubmit.innerHTML = 'Ingresar al Sistema';
            btnSubmit.disabled = false;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('d-none');
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando...';
            btnSubmit.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const q = query(collection(db, "usuarios"), where("correo", "==", email));
                const querySnapshot = await getDocs(q);

                let rolUsuario = 'Supervisor'; 
                let estadoUsuario = 'Aprobado';
                let nombreUsuario = 'Usuario';

                if (!querySnapshot.empty) {
                    const userData = querySnapshot.docs[0].data();
                    rolUsuario = userData.rol;
                    estadoUsuario = userData.estado || 'Aprobado';
                    nombreUsuario = userData.nombre_completo || 'Usuario';
                }

                if (estadoUsuario !== 'Aprobado') {
                    await signOut(auth);
                    mostrarError("Tu cuenta ha sido desactivada o rechazada.");
                    return;
                }

                // 2. CREACIÓN DE SESIÓN PERSISTENTE
                const token = await user.getIdToken();
                localStorage.setItem('sadafa_token', token);
                localStorage.setItem('sadafa_rol', rolUsuario);
                localStorage.setItem('sadafa_nombre', nombreUsuario);
                localStorage.setItem('sadafa_last_activity', Date.now()); // Marca de tiempo inicial
                
                window.location.replace('admin.html');

            } catch (error) {
                console.error("Error Auth:", error.code);
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    mostrarError('Correo o contraseña incorrectos.');
                } else if (error.code === 'auth/too-many-requests') {
                    mostrarError('Demasiados intentos. Intenta más tarde.');
                } else {
                    mostrarError('Error de conexión. Intente nuevamente.');
                }
            }
        });
    </script>
</body>
</html>
