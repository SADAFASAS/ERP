<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADAFA - Acceso ERP</title>
    <!-- ICONOS PARA NAVEGADOR Y ACCESO DIRECTO EN CELULARES -->
    <link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_o9yz3yo9yz3yo9yz.jpg">
    <link rel="apple-touch-icon" href="Gemini_Generated_Image_o9yz3yo9yz3yo9yz.jpg">
    <meta name="apple-mobile-web-app-title" content="SADAFA ERP">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.96);
            padding: 2.5rem 2.2rem;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 420px;
            border: 1px solid #334155;
            position: relative;
            z-index: 10;
        }
        .brand-logo {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #2dd4bf;
            display: block;
            margin: 0 auto 12px auto;
        }
        .brand-title {
            font-weight: 800;
            color: #2dd4bf;
            text-align: center;
            margin-bottom: 0.25rem;
            font-size: 1.9rem;
            letter-spacing: 1px;
        }
        .brand-subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 11px 12px;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #2dd4bf;
            box-shadow: 0 0 0 0.2rem rgba(45, 212, 191, 0.25);
            color: #f8fafc;
        }
        .btn-login {
            background-color: #0b3c36;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.25s, color 0.25s;
        }
        .btn-login:hover {
            background-color: #2dd4bf;
            color: #0b3c36;
        }
        .bg-circle-1 {
            position: fixed;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
            top: -120px;
            left: -120px;
            z-index: 1;
            border-radius: 50%;
        }
        .bg-circle-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(11, 60, 54, 0.2) 0%, rgba(15, 23, 42, 0) 70%);
            bottom: -160px;
            right: -160px;
            z-index: 1;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>

    <div class="login-card">
        <img src="Gemini_Generated_Image_o9yz3yo9yz3yo9yz.jpg" alt="Logo SADAFA" class="brand-logo" onerror="this.style.display='none'">
        <h1 class="brand-title">SADAFA <i class="bi bi-shield-lock ms-1"></i></h1>
        <p class="brand-subtitle">Servicios Integrales S.A.S.</p>

        <div id="errorAlert" class="alert alert-danger d-none small py-2" role="alert"></div>

        <form id="loginForm" autocomplete="on">
            <div class="mb-3">
                <label for="usuarioInput" class="form-label text-secondary small fw-bold ms-1">Documento o Correo</label>
                <input type="text" id="usuarioInput" class="form-control" placeholder="Número de cédula o correo" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary small fw-bold ms-1">Contraseña</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="btnVerPass" title="Mostrar/Ocultar contraseña" style="border-color: #334155;">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-login w-100">Ingresar al Sistema</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC81HOxo4CAcIe1jFeZB63sc7MTGAfngOY",
            authDomain: "sadafa-erp.firebaseapp.com",
            projectId: "sadafa-erp",
            storageBucket: "sadafa-erp.firebasestorage.app",
            messagingSenderId: "874852761234",
            appId: "1:874852761234:web:2604386d38e9d84233b04b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TIEMPO_LIMITE_INACTIVIDAD = 10 * 60 * 1000; // 10 Minutos

        // Verificar sesión vigente al abrir index.html
        const tokenActivo = localStorage.getItem('sadafa_token');
        const ultimaActividad = localStorage.getItem('sadafa_last_activity');

        if (tokenActivo && ultimaActividad) {
            const tiempoInactivo = Date.now() - parseInt(ultimaActividad);
            if (tiempoInactivo < TIEMPO_LIMITE_INACTIVIDAD) {
                window.location.replace('admin.html');
            } else {
                localStorage.removeItem('sadafa_token');
                localStorage.removeItem('sadafa_rol');
                localStorage.removeItem('sadafa_nombre');
                localStorage.removeItem('sadafa_last_activity');
                signOut(auth);
            }
        }

        // Mostrar / ocultar contraseña
        document.getElementById('btnVerPass').addEventListener('click', () => {
            const passInput = document.getElementById('password');
            const icon = document.querySelector('#btnVerPass i');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const btnSubmit = document.getElementById('btnSubmit');

        function mostrarError(mensaje) {
            errorAlert.innerText = mensaje;
            errorAlert.classList.remove('d-none');
            btnSubmit.innerHTML = 'Ingresar al Sistema';
            btnSubmit.disabled = false;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('d-none');
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando...';
            btnSubmit.disabled = true;

            const entrada = document.getElementById('usuarioInput').value.trim();
            const password = document.getElementById('password').value;

            try {
                let correoFinal = entrada;
                let userData = null;

                // Si ingresó número de documento (sin @), buscamos su correo en Firestore
                if (!entrada.includes('@')) {
                    const qDoc = query(collection(db, "usuarios"), where("documento", "==", entrada));
                    const snapDoc = await getDocs(qDoc);
                    if (snapDoc.empty) {
                        mostrarError('No existe un usuario registrado con ese documento.');
                        return;
                    }
                    userData = snapDoc.docs[0].data();
                    correoFinal = userData.correo;
                }

                // 1. Iniciar sesión en Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, correoFinal, password);
                const user = userCredential.user;

                // 2. Si ingresó con correo, consultamos sus datos en Firestore
                if (!userData) {
                    const qMail = query(collection(db, "usuarios"), where("correo", "==", correoFinal));
                    const snapMail = await getDocs(qMail);
                    if (!snapMail.empty) {
                        userData = snapMail.docs[0].data();
                    }
                }

                const rolUsuario = userData?.rol || 'Supervisor';
                const estadoUsuario = userData?.estado || 'Aprobado';
                const nombreUsuario = userData?.nombre_completo || 'Usuario';

                // 3. Bloquear si el usuario no está aprobado
                if (estadoUsuario !== 'Aprobado') {
                    await signOut(auth);
                    mostrarError('Tu cuenta ha sido desactivada o está pendiente de aprobación.');
                    return;
                }

                // 4. Guardar sesión y marca de tiempo
                const token = await user.getIdToken();
                localStorage.setItem('sadafa_token', token);
                localStorage.setItem('sadafa_rol', rolUsuario);
                localStorage.setItem('sadafa_nombre', nombreUsuario);
                localStorage.setItem('sadafa_last_activity', Date.now());

                window.location.replace('admin.html');

            } catch (error) {
                console.error("Error Auth:", error.code || error);
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    mostrarError('Usuario o contraseña incorrectos.');
                } else if (error.code === 'auth/too-many-requests') {
                    mostrarError('Demasiados intentos. Intenta más tarde.');
                } else {
                    mostrarError('Error de conexión o permisos. Intente nuevamente.');
                }
            }
        });
    </script>
</body>
</html>
